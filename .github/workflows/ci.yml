name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check crawler tests

      - name: Type-check (mypy)
        run: mypy crawler

      - name: Run tests
        # Integration tests are marked and auto-skip when Docker is unavailable;
        # on CI the Docker daemon is present so Testcontainers spins up infra.
        run: pytest -q
