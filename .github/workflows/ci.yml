name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check crawler tests

      - name: Type-check (mypy)
        run: .venv/bin/mypy crawler

      - name: Run tests
        # Integration tests are marked and auto-skip when Docker is unavailable;
        # on CI the Docker daemon is present so Testcontainers spins up infra.
        run: .venv/bin/pytest -q
