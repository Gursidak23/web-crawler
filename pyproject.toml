[project]
name = "web-crawler"
version = "0.1.0"
description = "A horizontally-scalable distributed web crawler (asyncio) showcasing SDE-2 system design and data structures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moonshot" }]

dependencies = [
    "aiohttp>=3.10",
    "selectolax>=0.3.21",
    "tldextract>=5.1",
    "w3lib>=2.1",
    "protego>=0.3.1",
    "aiokafka>=0.11",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "mmh3>=4.1",
    "minio>=7.2",
]

[project.scripts]
crawler = "crawler.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis,kafka]>=4.5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI dependency-injection default args

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that require Docker-backed infrastructure (Postgres/Redis/Kafka)",
]
